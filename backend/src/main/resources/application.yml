server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: tracegrid-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tracegrid?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 86400
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 文件存储配置
file:
  upload-path: ./uploads
  access-url: http://localhost:8080/api/file/preview

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# 溯源页智能问答（Python FastAPI：uvicorn app_api:app --port 8000）
tracegrid:
  rag:
    base-url: http://127.0.0.1:8000
  open-query:
    rate-limit-per-minute: 120
